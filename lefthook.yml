pre-commit:
  commands:
    biome:
      root: "code/"
      glob: "*.{ts,tsx,js,cjs,json,css}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typecheck:
      root: "code/"
      run: bun run typecheck

pre-push:
  commands:
    # The repo-local hooksPath hides the global hooks, so keep the global mainline push guard.
    protected-branches:
      run: "$HOME/.config/git/hooks/pre-push {1} {2}"
      use_stdin: true
    # git exports GIT_DIR and friends to hooks; tests that spawn git would then act on this repo.
    test:
      root: "code/"
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_NAMESPACE bun run test
    knip:
      root: "code/"
      run: bun run knip
    deps:
      root: "code/"
      run: bun run deps
    dup:
      root: "code/"
      run: bun run dup
    size:
      root: "code/"
      run: bun run size

commit-msg:
  commands:
    commitlint:
      root: "code/"
      run: bunx commitlint --config commitlint.config.ts --edit {1}
