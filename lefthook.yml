pre-commit:
  commands:
    biome:
      root: "code/"
      glob: "*.{ts,tsx,js,cjs,json,css}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typecheck:
      root: "code/"
      run: bun run typecheck

pre-push:
  commands:
    # The repo-local hooksPath hides the global hooks, so keep the global mainline push guard.
    protected-branches:
      run: "$HOME/.config/git/hooks/pre-push {1} {2}"
      use_stdin: true
    test:
      root: "code/"
      run: bun run test
    knip:
      root: "code/"
      run: bun run knip
    deps:
      root: "code/"
      run: bun run deps
    dup:
      root: "code/"
      run: bun run dup
    size:
      root: "code/"
      run: bun run size

commit-msg:
  commands:
    commitlint:
      root: "code/"
      run: bunx commitlint --config commitlint.config.ts --edit {1}
