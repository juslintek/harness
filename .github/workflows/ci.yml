name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    # the tests run the real srt sandbox, which needs macOS sandbox-exec
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: test -f zig/build.zig && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.yes == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - if: steps.has.outputs.yes == 'true'
        working-directory: zig
        run: |
          zig fmt --check .
          zig build test -Doptimize=ReleaseSafe --summary all
          zig build -Doptimize=ReleaseSafe
