name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    # the tests run the real srt sandbox, which needs macOS sandbox-exec
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # @shared imports resolve their packages (zod) from code/node_modules, and the e2e
      # fixture starts the TS server from ../code
      - run: bun install --frozen-lockfile
        working-directory: code
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  conformance:
    # the stub agent runs inside the real srt sandbox, which needs macOS sandbox-exec
    runs-on: macos-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: HARNESS_TARGET=ts bun run conformance

  zig:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: has
        # a zig/ tree without build.zig is a failure, only a missing zig/ is a skip
        run: |
          if [ -f zig/build.zig ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          elif [ -d zig ]; then echo "zig/ exists without zig/build.zig" >&2; exit 1
          else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.yes == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # the runtimes tests spawn bun running code/scripts/fake-acp-agent.ts
      - if: steps.has.outputs.yes == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.has.outputs.yes == 'true'
        working-directory: code
        run: bun install --frozen-lockfile
      - if: steps.has.outputs.yes == 'true'
        working-directory: zig
        run: |
          zig fmt --check .
          zig build test -Doptimize=ReleaseSafe --summary all
          zig build -Doptimize=ReleaseSafe
